name: UPDATE
on:
  workflow_dispatch:
    branches:
      - main
  schedule:
    - cron: '0 */1 * * *'
concurrency:
  group: wait
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          repository: BlankTMing/ManifestAutoUpdate_Code
          submodules: recursive
          token: ${{ secrets.TOKEN }}
      - name: 设置 Python 3.x
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 配置 Git
        run: |
          git config --local user.name github-actions[bot]
          git config --local user.email github-actions[bot]@github.com
          git fetch --depth=1 origin data:origin_data
          git worktree add -b data data origin_data
          git remote set-url origin https://github.com/BlankTMing/ManifestHub
      - name: 运行脚本
        run: |
          mapfile -t IDS < <(
            git ls-remote --heads origin \
              | cut -f2 \
              | sed 's/refs\/heads\///' \
              | grep -vx -e 'app' -e '101010101010101' -e '010101010101010' -e 'data' -e '001000001000'
          )

          batchSize=300
          total=${#IDS[@]}
          echo "共 $total 个分支，每批 $batchSize"

          for ((i = 0; i < total; i += batchSize)); do
            batch=("${IDS[@]:i:batchSize}")
            echo "===== 第 $((i / batchSize + 1)) 批：${#batch[@]} 个 ====="
            printf '  %s\n' "${batch[@]}"

            python AppidGetManifest.py -a "${batch[@]}"
          done
